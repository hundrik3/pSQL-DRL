name: PostgreSQL recovery lab
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check runtime
        run: |
          docker version
          docker compose version
          python3 --version
      - name: Run isolated disaster recovery exercises
        run: make test
      - name: Upload current run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-evidence-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 7
